[project]
name = "darkroom"
version = "0.1.0"
description = "Local image generation studio: a Gradio UI on a ComfyUI backend"
readme = "README.md"
authors = [
    { name = "Pierre Bruno", email = "pierrebruno@hotmail.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.32.0",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "websocket-client>=1.9.2",
]

[project.scripts]
darkroom = "darkroom:main"

[project.optional-dependencies]
modal = [
    "modal>=1.6.4",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
